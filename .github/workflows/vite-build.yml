name: Vite Build

on:
  workflow_call:
    inputs:
      pnpm-filter:
        description: "pnpm --filter target. Empty for monolithic packages."
        type: string
        default: ""
      pnpm-version:
        type: string
        default: "11"
      node-version-file:
        description: "Path to .node-version, relative to repo root"
        type: string
        default: ".node-version"
      lockfile-path:
        description: "Path to pnpm-lock.yaml, relative to repo root"
        type: string
        default: "pnpm-lock.yaml"
      typecheck-script:
        description: "pnpm script name for typecheck"
        type: string
        default: "typecheck"
      test-script:
        description: "pnpm script name for unit tests"
        type: string
        default: "test"
      build-script:
        description: "pnpm script name for production build"
        type: string
        default: "build"

jobs:
  typecheck-test-build:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: naoki1510/ci-workflows/.github/actions/setup-pnpm-node@v2
        with:
          pnpm-version: ${{ inputs.pnpm-version }}
          node-version-file: ${{ inputs.node-version-file }}
          lockfile-path: ${{ inputs.lockfile-path }}

      - name: Typecheck
        env:
          PNPM_FILTER: ${{ inputs.pnpm-filter }}
          TYPECHECK_SCRIPT: ${{ inputs.typecheck-script }}
        run: |
          if [ -n "$PNPM_FILTER" ]; then
            pnpm --filter "$PNPM_FILTER" run "$TYPECHECK_SCRIPT"
          else
            pnpm run "$TYPECHECK_SCRIPT"
          fi

      - name: Test
        env:
          PNPM_FILTER: ${{ inputs.pnpm-filter }}
          TEST_SCRIPT: ${{ inputs.test-script }}
        run: |
          if [ -n "$PNPM_FILTER" ]; then
            pnpm --filter "$PNPM_FILTER" run "$TEST_SCRIPT"
          else
            pnpm run "$TEST_SCRIPT"
          fi

      - name: Build
        env:
          PNPM_FILTER: ${{ inputs.pnpm-filter }}
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: |
          if [ -n "$PNPM_FILTER" ]; then
            pnpm --filter "$PNPM_FILTER" run "$BUILD_SCRIPT"
          else
            pnpm run "$BUILD_SCRIPT"
          fi
