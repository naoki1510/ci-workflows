name: Check generated code

# rswag + @hey-api/openapi-ts を使うリポジトリで生成物の最新性を検証する。
# 1 job 内で rails + pnpm 両方のセットアップを使うため、独立 job 化を避けている。

on:
  workflow_call:
    inputs:
      # --- backend ---
      rails-working-directory:
        description: "Rails app directory"
        type: string
        required: true
      install-system-packages:
        description: "Space-separated apt packages for bundling"
        type: string
        default: ""
      db-engine:
        description: "Database engine: postgres or mysql"
        type: string
        required: true
      postgres-version:
        type: string
        default: "17"
      mysql-version:
        type: string
        default: "8.4"
      mysql-database:
        type: string
        default: "app_test"
      test-prepare-cmd:
        description: "Shell command string evaluated with `eval` for test DB prep. Swaggerize boots Rails so DB schema is required. Caller must be trusted."
        type: string
        default: "bin/rails db:test:prepare"
      swaggerize-cmd:
        description: "Shell command string evaluated with `eval` to regenerate OpenAPI spec, run under rails-working-directory. Caller must be trusted."
        type: string
        default: "bundle exec rake rswag:specs:swaggerize"
      swagger-path:
        description: "Path to the regenerated swagger.yaml from repo root. Used as the diff target."
        type: string
        required: true

      # --- frontend ---
      pnpm-filter:
        description: "pnpm --filter target. Empty for monolithic packages."
        type: string
        default: ""
      pnpm-version:
        type: string
        default: "11"
      node-version-file:
        type: string
        default: ".node-version"
      lockfile-path:
        type: string
        default: "pnpm-lock.yaml"
      codegen-script:
        description: "Frontend client regeneration script name. Passed as pnpm argument, not eval'd."
        type: string
        default: "codegen"
      generated-code-path:
        description: "Path to generated code from repo root. Directory or file, used as the diff target."
        type: string
        required: true

jobs:
  check:
    name: Check generated code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: ${{ inputs.db-engine == 'postgres' && format('postgres:{0}', inputs.postgres-version) || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mysql:
        image: ${{ inputs.db-engine == 'mysql' && format('mysql:{0}', inputs.mysql-version) || '' }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ${{ inputs.mysql-database }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: ${{ inputs.mysql-database }}
    steps:
      - uses: actions/checkout@v6

      # --- backend: swagger.yaml ---
      - uses: naoki1510/ci-workflows/.github/actions/setup-rails@v2
        with:
          working-directory: ${{ inputs.rails-working-directory }}
          install-system-packages: ${{ inputs.install-system-packages }}

      # caller 由来のコマンド文字列は env 経由で eval。rails-test.yml と同じ運用。
      - name: Prepare test DB
        working-directory: ${{ inputs.rails-working-directory }}
        env:
          TEST_PREPARE_CMD: ${{ inputs.test-prepare-cmd }}
        run: eval "$TEST_PREPARE_CMD"

      - name: Regenerate OpenAPI spec
        working-directory: ${{ inputs.rails-working-directory }}
        env:
          SWAGGERIZE_CMD: ${{ inputs.swaggerize-cmd }}
        run: eval "$SWAGGERIZE_CMD"

      - name: Check OpenAPI spec is up to date
        env:
          SWAGGER_PATH: ${{ inputs.swagger-path }}
        run: |
          if ! git diff --exit-code "$SWAGGER_PATH"; then
            echo "::error::$SWAGGER_PATH が最新ではありません。手元で再生成してコミットしてください。"
            exit 1
          fi

      # --- frontend: hey-api codegen ---
      - uses: naoki1510/ci-workflows/.github/actions/setup-pnpm-node@v2
        with:
          pnpm-version: ${{ inputs.pnpm-version }}
          node-version-file: ${{ inputs.node-version-file }}
          lockfile-path: ${{ inputs.lockfile-path }}

      - name: Regenerate frontend API client
        env:
          # job-level の RAILS_ENV / POSTGRES_* / MYSQL_* が frontend にも流れるのを遮断
          RAILS_ENV: ""
          POSTGRES_HOST: ""
          POSTGRES_USER: ""
          POSTGRES_PASSWORD: ""
          MYSQL_HOST: ""
          MYSQL_DATABASE: ""
          PNPM_FILTER: ${{ inputs.pnpm-filter }}
          CODEGEN_SCRIPT: ${{ inputs.codegen-script }}
        run: |
          if [ -n "$PNPM_FILTER" ]; then
            pnpm --filter "$PNPM_FILTER" run "$CODEGEN_SCRIPT"
          else
            pnpm run "$CODEGEN_SCRIPT"
          fi

      - name: Check generated code is up to date
        env:
          GENERATED_CODE_PATH: ${{ inputs.generated-code-path }}
        run: |
          if ! git diff --exit-code "$GENERATED_CODE_PATH"; then
            echo "::error::$GENERATED_CODE_PATH が最新ではありません。手元で再生成してコミットしてください。"
            exit 1
          fi
