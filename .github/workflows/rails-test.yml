name: Rails Test

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Rails app directory"
        type: string
        required: true
      db-engine:
        description: "Database engine: postgres or mysql"
        type: string
        required: true
      postgres-version:
        type: string
        default: "17"
      mysql-version:
        type: string
        default: "8.4"
      mysql-database:
        description: "MySQL database name created by the service container"
        type: string
        default: "app_test"
      test-prepare-cmd:
        description: "Shell command string evaluated with `eval` to prepare the test DB. Caller must be trusted."
        type: string
        default: "bin/rails db:test:prepare"
      test-cmd:
        description: "Shell command string evaluated with `eval` to run tests. Caller must be trusted."
        type: string
        default: "bundle exec rspec"
      install-system-packages:
        description: "Space-separated apt packages to install before bundling. Empty to skip."
        type: string
        default: ""

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      postgres:
        image: ${{ inputs.db-engine == 'postgres' && format('postgres:{0}', inputs.postgres-version) || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mysql:
        image: ${{ inputs.db-engine == 'mysql' && format('mysql:{0}', inputs.mysql-version) || '' }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ${{ inputs.mysql-database }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: ${{ inputs.mysql-database }}
    steps:
      - uses: actions/checkout@v6

      - uses: naoki1510/ci-workflows/.github/actions/setup-rails@v2
        with:
          working-directory: ${{ inputs.working-directory }}
          install-system-packages: ${{ inputs.install-system-packages }}

      # caller 由来のコマンド文字列は env 経由で eval。`run: ${{ inputs.* }}` 直接展開は
      # YAML 解析時にコマンド注入されるため避ける。eval 自体は trusted caller 前提。
      - name: Prepare test DB
        env:
          TEST_PREPARE_CMD: ${{ inputs.test-prepare-cmd }}
        run: eval "$TEST_PREPARE_CMD"

      - name: Run tests
        env:
          TEST_CMD: ${{ inputs.test-cmd }}
        run: eval "$TEST_CMD"
