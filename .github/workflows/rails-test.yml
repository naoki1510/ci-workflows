name: Rails Test

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Rails app directory (e.g. backend, server)"
        type: string
        required: true
      db-engine:
        description: "Database engine: postgres or mysql"
        type: string
        required: true
      postgres-version:
        type: string
        default: "17"
      mysql-version:
        type: string
        default: "8.4"
      mysql-database:
        description: "MySQL database name created by the service container"
        type: string
        default: "app_test"
      test-prepare-cmd:
        description: "Command to prepare the test database"
        type: string
        default: "bin/rails db:test:prepare"
      test-cmd:
        description: "Command to run tests"
        type: string
        default: "bundle exec rspec"
      install-system-packages:
        description: "Extra apt packages to install before bundling (space separated). Empty to skip."
        type: string
        default: ""

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      postgres:
        image: ${{ inputs.db-engine == 'postgres' && format('postgres:{0}', inputs.postgres-version) || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mysql:
        image: ${{ inputs.db-engine == 'mysql' && format('mysql:{0}', inputs.mysql-version) || '' }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ${{ inputs.mysql-database }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: ${{ inputs.mysql-database }}
    steps:
      - uses: actions/checkout@v6

      - uses: naoki1510/ci-workflows/.github/actions/setup-rails@v2
        with:
          working-directory: ${{ inputs.working-directory }}
          install-system-packages: ${{ inputs.install-system-packages }}

      # caller 由来の input を `run:` に直接展開すると workflow injection の入り口に
      # なるため (caller が ';' 等を仕込むと任意コード実行)、env 経由で値を渡して
      # bash 変数として参照する。任意コマンドラインを許す柔軟性を維持するため
      # `eval` で評価する (caller は trusted、env で渡せば YAML テンプレ展開での
      # bypass は防げる)。
      - name: Prepare test DB
        env:
          TEST_PREPARE_CMD: ${{ inputs.test-prepare-cmd }}
        run: eval "$TEST_PREPARE_CMD"

      - name: Run tests
        env:
          TEST_CMD: ${{ inputs.test-cmd }}
        run: eval "$TEST_CMD"
