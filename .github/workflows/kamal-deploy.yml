name: Kamal Deploy

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Rails app directory containing config/deploy.yml"
        type: string
        required: true
      buildx:
        description: "Set up Docker buildx (recommended for multi-arch builds)"
        type: boolean
        default: true
    secrets:
      ssh-private-key:
        description: "Private SSH key written to ~/.ssh/id_ed25519"
        required: true
      ssh-known-hosts:
        description: "Pre-shared known_hosts entries appended to ~/.ssh/known_hosts"
        required: false
      env-vars:
        description: "Multi-line KEY=value pairs forwarded to GITHUB_ENV before kamal deploy"
        required: false

jobs:
  deploy:
    name: Kamal deploy
    runs-on: ubuntu-latest
    # Hoisted to job-level so the "Forward env vars" step's `if:` can read it.
    # Secrets cannot be referenced directly in a step's `if:`, so we expose
    # only a derived boolean flag here; the secret body itself stays scoped
    # to the step's `env:`.
    env:
      HAS_ENV_VARS: ${{ secrets.env-vars != '' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: ${{ inputs.working-directory }}

      - name: Set up Docker Buildx
        if: ${{ inputs.buildx }}
        uses: docker/setup-buildx-action@v4

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ssh-private-key }}
          SSH_KNOWN_HOSTS: ${{ secrets.ssh-known-hosts }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          fi

      - name: Forward env vars
        if: ${{ env.HAS_ENV_VARS == 'true' }}
        shell: bash
        env:
          ENV_VARS: ${{ secrets.env-vars }}
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            echo "$line" >> "$GITHUB_ENV"
          done <<<"$ENV_VARS"

      - name: Deploy with Kamal
        run: bin/kamal deploy
