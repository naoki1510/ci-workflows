name: Vite Lint

on:
  workflow_call:
    inputs:
      pnpm-filter:
        description: "pnpm --filter target (e.g. frontend). Empty for monolithic packages."
        type: string
        default: ""
      pnpm-version:
        type: string
        default: "11"
      node-version-file:
        description: "Path to .node-version (relative to repo root)"
        type: string
        default: ".node-version"
      lockfile-path:
        description: "Path to pnpm-lock.yaml (relative to repo root)"
        type: string
        default: "pnpm-lock.yaml"
      lint-script:
        type: string
        default: "lint"
      format-check-script:
        type: string
        default: "format:check"

jobs:
  lint-and-format:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: naoki1510/ci-workflows/.github/actions/setup-pnpm-node@v2
        with:
          pnpm-version: ${{ inputs.pnpm-version }}
          node-version-file: ${{ inputs.node-version-file }}
          lockfile-path: ${{ inputs.lockfile-path }}

      # caller の input を `run:` に直接展開せず env 経由でシェル変数として参照する
      # (workflow injection 対策)。値は pnpm の引数として渡され、shell の評価は経由しない
      # ため metacharacter が混入しても安全。
      - name: ESLint
        id: eslint
        env:
          PNPM_FILTER: ${{ inputs.pnpm-filter }}
          LINT_SCRIPT: ${{ inputs.lint-script }}
        run: |
          if [ -n "$PNPM_FILTER" ]; then
            pnpm --filter "$PNPM_FILTER" run "$LINT_SCRIPT"
          else
            pnpm run "$LINT_SCRIPT"
          fi

      - name: Prettier check
        if: ${{ !cancelled() }}
        env:
          PNPM_FILTER: ${{ inputs.pnpm-filter }}
          FORMAT_CHECK_SCRIPT: ${{ inputs.format-check-script }}
        run: |
          if [ -n "$PNPM_FILTER" ]; then
            pnpm --filter "$PNPM_FILTER" run "$FORMAT_CHECK_SCRIPT"
          else
            pnpm run "$FORMAT_CHECK_SCRIPT"
          fi
