name: "Setup Rails"
description: >-
  Install system packages and set up Ruby with bundler-cache.
  Caller must run `actions/checkout` first.

inputs:
  working-directory:
    description: "Rails app directory. Used as `bundler-cache` working directory."
    required: true
  install-system-packages:
    description: "Space-separated apt packages to install before bundling. Empty to skip."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install system packages
      if: inputs.install-system-packages != ''
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.install-system-packages }}
      run: |
        sudo apt-get update
        # 配列化してから apt-get に渡し、glob 展開 / word-splitting の事故を防ぐ
        read -ra PACKAGES <<< "$EXTRA_PACKAGES"
        sudo apt-get install --no-install-recommends -y "${PACKAGES[@]}"

    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
        working-directory: ${{ inputs.working-directory }}
