name: "Setup Rails"
description: >-
  Install system packages and set up Ruby with bundler-cache.
  Caller is responsible for `actions/checkout`. This action does NOT prepare the
  test DB — wrap with a service container + `db:test:prepare` step in the
  caller workflow when needed.

inputs:
  working-directory:
    description: "Rails app directory (e.g. backend, server). Used as `bundler-cache` working directory."
    required: true
  install-system-packages:
    description: "Extra apt packages to install before bundling (space separated). Empty to skip."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install system packages
      if: inputs.install-system-packages != ''
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.install-system-packages }}
      run: |
        sudo apt-get update
        # space-separated 文字列を配列化してから apt-get に渡す。
        # `$EXTRA_PACKAGES` のクォートなし展開を避け、glob 展開・word-splitting の
        # 意図しない挙動を防ぐ (例: パッケージ名に `*` が混入した場合の事故予防)。
        read -ra PACKAGES <<< "$EXTRA_PACKAGES"
        sudo apt-get install --no-install-recommends -y "${PACKAGES[@]}"

    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
        working-directory: ${{ inputs.working-directory }}
