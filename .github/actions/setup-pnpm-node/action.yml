name: "Setup pnpm and Node.js"
description: >-
  Set up pnpm + Node.js, restore node_modules cache, and run `pnpm install --frozen-lockfile`.
  Caller is responsible for `actions/checkout`.
  `pnpm install` は常に repo root で実行する想定 (pnpm workspaces 構成を前提)。
  monorepo のサブパッケージだけを install したい場合は caller 側で `pnpm --filter`
  を使うことを想定し、ここでは working-directory は input にしていない。

inputs:
  pnpm-version:
    description: "pnpm major version (passed to pnpm/action-setup)"
    required: false
    default: "11"
  node-version-file:
    description: "Path to .node-version (relative to repo root)"
    required: false
    default: ".node-version"
  lockfile-path:
    description: "Path to pnpm-lock.yaml (relative to repo root)"
    required: false
    default: "pnpm-lock.yaml"

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    # `cache: pnpm` は pnpm store (~/.local/share/pnpm/store) をキャッシュする。
    # node_modules ごとは別途 actions/cache でキャッシュし、両方 hit 時は install を
    # スキップして高速化する (store キャッシュ単独だと install 自体は走る = 5-10 秒)。
    # 容量と速度のトレードオフは「速度重視」で両方持つ既存方針を踏襲。
    - uses: actions/setup-node@v6
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.lockfile-path }}

    - name: Cache node_modules
      id: node-modules-cache
      uses: actions/cache@v4
      with:
        path: "**/node_modules"
        key: node-modules-${{ runner.os }}-pnpm${{ inputs.pnpm-version }}-${{ hashFiles(inputs.node-version-file, inputs.lockfile-path) }}

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
