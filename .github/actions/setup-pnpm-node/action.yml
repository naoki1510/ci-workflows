name: "Setup pnpm and Node.js"
description: >-
  Set up pnpm + Node.js, restore caches, and run `pnpm install --frozen-lockfile` at repo root.
  Caller is responsible for `actions/checkout`. pnpm workspaces 構成を前提とする。

inputs:
  pnpm-version:
    description: "pnpm version. Empty to use the packageManager field in package.json"
    required: false
    default: ""
  node-version-file:
    description: "Path to .node-version, relative to repo root"
    required: false
    default: ".node-version"
  lockfile-path:
    description: "Path to pnpm-lock.yaml, relative to repo root"
    required: false
    default: "pnpm-lock.yaml"

runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v4
      if: inputs.pnpm-version != ''
      with:
        version: ${{ inputs.pnpm-version }}

    - uses: pnpm/action-setup@v4
      if: inputs.pnpm-version == ''

    - name: Get pnpm version
      id: pnpm-version
      shell: bash
      run: echo "version=$(pnpm --version)" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-node@v6
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.lockfile-path }}

    - name: Cache node_modules
      id: node-modules-cache
      uses: actions/cache@v4
      with:
        path: "**/node_modules"
        key: node-modules-${{ runner.os }}-pnpm${{ steps.pnpm-version.outputs.version }}-${{ hashFiles(inputs.node-version-file, inputs.lockfile-path) }}

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
